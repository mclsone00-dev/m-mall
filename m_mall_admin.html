<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>M Mall Admin Dashboard</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    :root {
      --color-blue: #4285F4;
      --color-blue-hover: #1557b0;
      --color-yellow: #FBBC05;
      --color-green: #34A853;
      --color-black: #000000;
      --color-white: #ffffff;
    }
    .bg-brand-black { background-color: var(--color-black); }
    .bg-brand-blue { background-color: var(--color-blue); }
    .bg-brand-blue:hover { background-color: var(--color-blue-hover); }
    .text-brand-blue { color: var(--color-blue); }
  </style>

  <!-- Firebase Compat SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-50 font-sans text-gray-800 antialiased min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-brand-black text-white sticky top-0 z-40 shadow-md">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <img src="images/logo.png" alt="M Mall" class="h-8 object-contain" onerror="this.onerror=null; this.src='https://via.placeholder.com/100x30?text=M+Mall';" />
        <span class="bg-blue-600 text-xs text-white px-2 py-0.5 rounded font-semibold uppercase tracking-wider">Admin</span>
      </div>
      <a href="index.html" class="flex items-center gap-2 bg-gray-800 hover:bg-gray-700 px-3 py-1.5 rounded-md text-sm border border-gray-600 transition-colors">
        <i class="fa-solid fa-store text-brand-yellow"></i>
        <span>View Shop</span>
      </a>
    </div>
  </header>

  <!-- Admin Main Layout -->
  <main class="max-w-7xl mx-auto px-4 py-8 flex-1 w-full grid grid-cols-1 lg:grid-cols-3 gap-8">

    <!-- Section 1: Product Creation Form -->
    <div class="lg:col-span-1">
      <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-6 sticky top-20">
        <h2 class="text-xl font-bold text-gray-900 mb-4 flex items-center gap-2">
          <i class="fa-solid fa-square-plus text-brand-blue"></i>
          <span>Post New Product</span>
        </h2>

        <form id="productForm" class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Product Title *</label>
            <input type="text" id="title" required placeholder="e.g., Wireless Bluetooth Headphones" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm" />
          </div>

          <div>
            <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Price (TSh) *</label>
            <input type="number" id="price" required placeholder="50000" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm" />
          </div>

          <div>
            <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Category</label>
            <select id="category" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm bg-white">
              <option value="General">General</option>
              <option value="Electronics">Electronics</option>
              <option value="Fashion">Fashion</option>
              <option value="Home & Kitchen">Home & Kitchen</option>
              <option value="Beauty">Beauty</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Description</label>
            <textarea id="description" rows="3" placeholder="Add short product specifications or details..." class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm"></textarea>
          </div>

          <!-- Dual Image Inputs -->
          <div class="border-t border-gray-200 pt-4 space-y-3">
            <span class="block text-xs font-semibold text-gray-700 uppercase">Product Image (Choose One Option)</span>
            
            <div>
              <label class="block text-xs text-gray-500 mb-1">Option A: Local File Upload</label>
              <input type="file" id="fileInput" accept="image/*" class="w-full text-xs text-gray-500 file:mr-3 file:py-1.5 file:px-3 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-brand-blue hover:file:bg-blue-100" />
            </div>

            <div class="text-center text-xs text-gray-400 font-bold">- OR -</div>

            <div>
              <label class="block text-xs text-gray-500 mb-1">Option B: Direct Image URL</label>
              <input type="url" id="imageUrlInput" placeholder="https://example.com/image.jpg" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm" />
            </div>
          </div>

          <button type="submit" id="submitBtn" class="w-full bg-brand-blue text-white font-semibold py-2.5 rounded-md hover:bg-blue-700 transition-colors flex items-center justify-center gap-2">
            <i class="fa-solid fa-cloud-arrow-up"></i>
            <span id="btnText">Save & Publish Product</span>
          </button>
        </form>
      </div>
    </div>

    <!-- Section 2: Manage Existing Products Table -->
    <div class="lg:col-span-2">
      <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-6">
        <div class="flex items-center justify-between mb-4">
          <h2 class="text-xl font-bold text-gray-900 flex items-center gap-2">
            <i class="fa-solid fa-list-check text-brand-blue"></i>
            <span>Manage Products</span>
          </h2>
          <span id="adminProductCount" class="text-xs bg-gray-100 text-gray-600 font-bold px-2.5 py-1 rounded-full">0 Items</span>
        </div>

        <div class="overflow-x-auto">
          <table class="w-full text-left text-sm text-gray-600">
            <thead class="bg-gray-100 text-gray-700 uppercase text-xs">
              <tr>
                <th class="p-3">Item</th>
                <th class="p-3">Category</th>
                <th class="p-3">Price</th>
                <th class="p-3 text-right">Actions</th>
              </tr>
            </thead>
            <tbody id="adminProductTable" class="divide-y divide-gray-200">
              <tr>
                <td colspan="4" class="text-center py-8 text-gray-400">Loading products...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <!-- Edit Modal -->
  <div id="editModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50 p-4">
    <div class="bg-white rounded-lg max-w-lg w-full p-6 shadow-xl relative">
      <button onclick="closeModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 text-lg">
        <i class="fa-solid fa-xmark"></i>
      </button>
      <h3 class="text-lg font-bold text-gray-900 mb-4">Edit Product Details</h3>
      
      <form id="editForm" class="space-y-4">
        <input type="hidden" id="editId" />
        <div>
          <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Title</label>
          <input type="text" id="editTitle" required class="w-full px-3 py-2 border rounded-md text-sm" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Price (TSh)</label>
          <input type="number" id="editPrice" required class="w-full px-3 py-2 border rounded-md text-sm" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Category</label>
          <input type="text" id="editCategory" class="w-full px-3 py-2 border rounded-md text-sm" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Image URL</label>
          <input type="url" id="editImageUrl" required class="w-full px-3 py-2 border rounded-md text-sm" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Description</label>
          <textarea id="editDescription" rows="3" class="w-full px-3 py-2 border rounded-md text-sm"></textarea>
        </div>

        <div class="flex justify-end gap-2 pt-2">
          <button type="button" onclick="closeModal()" class="px-4 py-2 border rounded-md text-sm text-gray-600 hover:bg-gray-50">Cancel</button>
          <button type="submit" class="px-4 py-2 bg-brand-blue text-white rounded-md text-sm font-semibold hover:bg-blue-700">Save Changes</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyCSX8vQVmSP1g-_WyyXy6Q3BLJBtxKgaao",
      authDomain: "m-center-tz.firebaseapp.com",
      projectId: "m-center-tz",
      storageBucket: "m-center-tz.firebasestorage.app",
      messagingSenderId: "240432444424",
      appId: "1:240432444424:web:1dbfe6519d8e2bc13f4dbd",
      measurementId: "G-S6QKP8JN1D"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // Cloudinary Constants
    const CLOUDINARY_URL = "https://api.cloudinary.com/v1_1/divvqc3b6/image/upload";
    const CLOUDINARY_PRESET = "test_chapel";

    let adminProductsList = [];

    // Real-Time Listener for Table
    db.collection('products')
      .orderBy('timestamp', 'desc')
      .onSnapshot((snapshot) => {
        adminProductsList = [];
        snapshot.forEach((doc) => adminProductsList.push({ id: doc.id, ...doc.data() }));
        renderAdminTable(adminProductsList);
      });

    function renderAdminTable(products) {
      const tbody = document.getElementById('adminProductTable');
      document.getElementById('adminProductCount').innerText = `${products.length} Items`;

      if (products.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" class="text-center py-6 text-gray-400">No products uploaded yet.</td></tr>`;
        return;
      }

      tbody.innerHTML = products.map((item) => `
        <tr class="hover:bg-gray-50 border-b border-gray-100">
          <td class="p-3 flex items-center gap-3">
            <img src="${item.imageUrl}" class="w-10 h-10 object-cover rounded border" onerror="this.src='https://via.placeholder.com/40';" />
            <div>
              <p class="font-bold text-gray-900 line-clamp-1">${escapeHtml(item.title)}</p>
              <p class="text-xs text-gray-400 line-clamp-1">${escapeHtml(item.description || 'No desc')}</p>
            </div>
          </td>
          <td class="p-3 text-xs"><span class="bg-gray-100 px-2 py-1 rounded">${escapeHtml(item.category || 'General')}</span></td>
          <td class="p-3 font-semibold text-gray-800">TSh ${Number(item.price).toLocaleString()}</td>
          <td class="p-3 text-right space-x-2">
            <button onclick="openEditModal('${item.id}')" class="text-blue-600 hover:text-blue-800 font-medium text-xs px-2 py-1 rounded border border-blue-200 hover:bg-blue-50">
              <i class="fa-solid fa-pen-to-square"></i> Edit
            </button>
            <button onclick="deleteProduct('${item.id}')" class="text-red-600 hover:text-red-800 font-medium text-xs px-2 py-1 rounded border border-red-200 hover:bg-red-50">
              <i class="fa-solid fa-trash"></i> Delete
            </button>
          </td>
        </tr>
      `).join('');
    }

    // Cloudinary File Upload Logic
    async function uploadToCloudinary(file) {
      const formData = new FormData();
      formData.append('file', file);
      formData.append('upload_preset', CLOUDINARY_PRESET);

      const response = await fetch(CLOUDINARY_URL, { method: 'POST', body: formData });
      if (!response.ok) throw new Error('Cloudinary upload failed');
      const data = await response.json();
      return data.secure_url;
    }

    // Handle Product Form Submission
    document.getElementById('productForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const btnText = document.getElementById('btnText');
      const submitBtn = document.getElementById('submitBtn');
      
      submitBtn.disabled = true;
      btnText.innerText = "Processing...";

      try {
        const title = document.getElementById('title').value.trim();
        const price = parseFloat(document.getElementById('price').value);
        const category = document.getElementById('category').value;
        const description = document.getElementById('description').value.trim();
        
        const fileInput = document.getElementById('fileInput');
        const imageUrlInput = document.getElementById('imageUrlInput').value.trim();

        let finalImageUrl = "";

        if (fileInput.files.length > 0) {
          btnText.innerText = "Uploading Image...";
          finalImageUrl = await uploadToCloudinary(fileInput.files[0]);
        } else if (imageUrlInput !== "") {
          finalImageUrl = imageUrlInput;
        } else {
          alert("Please provide an image URL or choose a local file.");
          submitBtn.disabled = false;
          btnText.innerText = "Save & Publish Product";
          return;
        }

        btnText.innerText = "Saving Product...";
        await db.collection('products').add({
          title,
          price,
          category,
          description,
          imageUrl: finalImageUrl,
          timestamp: firebase.firestore.FieldValue.serverTimestamp()
        });

        document.getElementById('productForm').reset();
        alert("Product published successfully!");
      } catch (err) {
        console.error(err);
        alert("Error creating product: " + err.message);
      } finally {
        submitBtn.disabled = false;
        btnText.innerText = "Save & Publish Product";
      }
    });

    // Delete Product
    async function deleteProduct(id) {
      if (confirm("Are you sure you want to delete this product?")) {
        try {
          await db.collection('products').doc(id).delete();
        } catch (err) {
          alert("Failed to delete product: " + err.message);
        }
      }
    }

    // Modal Control & Updating Products
    function openEditModal(id) {
      const product = adminProductsList.find((p) => p.id === id);
      if (!product) return;

      document.getElementById('editId').value = product.id;
      document.getElementById('editTitle').value = product.title || '';
      document.getElementById('editPrice').value = product.price || 0;
      document.getElementById('editCategory').value = product.category || 'General';
      document.getElementById('editImageUrl').value = product.imageUrl || '';
      document.getElementById('editDescription').value = product.description || '';

      document.getElementById('editModal').classList.remove('hidden');
      document.getElementById('editModal').classList.add('flex');
    }

    function closeModal() {
      document.getElementById('editModal').classList.add('hidden');
      document.getElementById('editModal').classList.remove('flex');
    }

    document.getElementById('editForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('editId').value;

      try {
        await db.collection('products').doc(id).update({
          title: document.getElementById('editTitle').value.trim(),
          price: parseFloat(document.getElementById('editPrice').value),
          category: document.getElementById('editCategory').value.trim(),
          imageUrl: document.getElementById('editImageUrl').value.trim(),
          description: document.getElementById('editDescription').value.trim()
        });
        closeModal();
      } catch (err) {
        alert("Failed to update product: " + err.message);
      }
    });

    function escapeHtml(str) {
      return (str || '').replace(/[&<>"']/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
    }
  </script>
</body>
</html>
