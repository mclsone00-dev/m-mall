<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>M Mall Admin Dashboard</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    :root {
      --color-blue: #4285F4;
      --color-blue-hover: #1557b0;
      --color-yellow: #FBBC05;
      --color-green: #34A853;
      --color-black: #000000;
      --color-white: #ffffff;
    }
  </style>

  <!-- Firebase Compat SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-50 font-sans text-gray-800 antialiased min-h-screen flex flex-col">

  <header class="bg-black text-white sticky top-0 z-40 shadow-md">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <img src="images/logo.png" alt="M Mall" class="h-7 object-contain" onerror="this.onerror=null; this.src='https://via.placeholder.com/100x30?text=M+Mall';" />
        <span class="bg-blue-600 text-[10px] text-white px-2 py-0.5 rounded font-bold uppercase">Admin</span>
      </div>
      <a href="index.html" class="flex items-center gap-1.5 bg-gray-800 hover:bg-gray-700 px-3 py-1.5 rounded-full text-xs text-yellow-400 border border-gray-700 font-medium">
        <i class="fa-solid fa-store"></i>
        <span>View Shop</span>
      </a>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-3 sm:px-4 py-6 flex-1 w-full grid grid-cols-1 lg:grid-cols-3 gap-6">

    <!-- Form -->
    <div class="lg:col-span-1">
      <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-4 sm:p-6 sticky top-20 max-h-[85vh] overflow-y-auto">
        <h2 class="text-lg font-bold text-gray-900 mb-4 flex items-center gap-2">
          <i class="fa-solid fa-square-plus text-[#4285F4]"></i>
          <span>Post New Product</span>
        </h2>

        <form id="productForm" class="space-y-3.5">
          <div>
            <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Product Title *</label>
            <input type="text" id="title" required placeholder="e.g., Wireless Earbuds" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm" />
          </div>

          <div>
            <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Price (TSh) *</label>
            <input type="number" id="price" required min="0" placeholder="35000" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm" />
          </div>

          <div>
            <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Category</label>
            <select id="category" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm bg-white">
              <option value="General">General</option>
              <option value="Electronics">Electronics</option>
              <option value="Fashion">Fashion</option>
              <option value="Home & Kitchen">Home & Kitchen</option>
              <option value="Beauty">Beauty</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Description</label>
            <textarea id="description" rows="2" placeholder="Product details..." class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm"></textarea>
          </div>

          <!-- Multiple Image Uploads & URLs Section (1 to 7) -->
          <div class="border-t border-gray-200 pt-3 space-y-3">
            <div class="flex items-center justify-between">
              <span class="block text-xs font-semibold text-gray-700 uppercase">Product Images (Up to 7)</span>
              <span class="text-[10px] text-gray-400">1st is Primary</span>
            </div>

            <!-- Local File Upload (Select up to 7 images) -->
            <div class="bg-blue-50/50 p-2.5 rounded border border-blue-200">
              <label class="block text-[11px] text-gray-700 font-semibold mb-1">Option A: Local Files (Select up to 7)</label>
              <input type="file" id="fileInput" accept="image/*" multiple class="w-full text-xs text-gray-500 file:mr-2 file:py-1 file:px-2.5 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-blue-100 file:text-[#4285F4]" />
              <p class="text-[10px] text-gray-400 mt-1">Hold Ctrl/Cmd to select multiple image files.</p>
            </div>

            <div class="text-center text-[10px] text-gray-400 font-bold">- OR DIRECT IMAGE URLS (1 - 7) -</div>

            <div class="space-y-2">
              <div>
                <label class="block text-[11px] font-medium text-gray-600 mb-0.5">1. Image URL (Main)</label>
                <input type="url" id="imageUrl1" placeholder="https://... (Primary Image)" class="w-full px-2.5 py-1.5 border border-gray-300 rounded-md text-xs" />
              </div>

              <div>
                <label class="block text-[11px] font-medium text-gray-600 mb-0.5">2. Image URL 2</label>
                <input type="url" id="imageUrl2" placeholder="https://..." class="w-full px-2.5 py-1.5 border border-gray-300 rounded-md text-xs" />
              </div>

              <div>
                <label class="block text-[11px] font-medium text-gray-600 mb-0.5">3. Image URL 3</label>
                <input type="url" id="imageUrl3" placeholder="https://..." class="w-full px-2.5 py-1.5 border border-gray-300 rounded-md text-xs" />
              </div>

              <div>
                <label class="block text-[11px] font-medium text-gray-600 mb-0.5">4. Image URL 4</label>
                <input type="url" id="imageUrl4" placeholder="https://..." class="w-full px-2.5 py-1.5 border border-gray-300 rounded-md text-xs" />
              </div>

              <div>
                <label class="block text-[11px] font-medium text-gray-600 mb-0.5">5. Image URL 5</label>
                <input type="url" id="imageUrl5" placeholder="https://..." class="w-full px-2.5 py-1.5 border border-gray-300 rounded-md text-xs" />
              </div>

              <div>
                <label class="block text-[11px] font-medium text-gray-600 mb-0.5">6. Image URL 6</label>
                <input type="url" id="imageUrl6" placeholder="https://..." class="w-full px-2.5 py-1.5 border border-gray-300 rounded-md text-xs" />
              </div>

              <div>
                <label class="block text-[11px] font-medium text-gray-600 mb-0.5">7. Image URL 7</label>
                <input type="url" id="imageUrl7" placeholder="https://..." class="w-full px-2.5 py-1.5 border border-gray-300 rounded-md text-xs" />
              </div>
            </div>
          </div>

          <button type="submit" id="submitBtn" class="w-full bg-[#4285F4] text-white font-semibold py-2.5 rounded-md hover:bg-blue-600 transition-colors flex items-center justify-center gap-2 text-sm shadow">
            <i class="fa-solid fa-cloud-arrow-up"></i>
            <span id="btnText">Save & Publish Product</span>
          </button>
        </form>
      </div>
    </div>

    <!-- Table -->
    <div class="lg:col-span-2">
      <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-4 sm:p-6">
        <div class="flex items-center justify-between mb-4">
          <h2 class="text-lg font-bold text-gray-900 flex items-center gap-2">
            <i class="fa-solid fa-list-check text-[#4285F4]"></i>
            <span>Manage Products</span>
          </h2>
          <span id="adminProductCount" class="text-xs bg-gray-100 text-gray-600 font-bold px-2 py-0.5 rounded-full">0 Items</span>
        </div>

        <div class="overflow-x-auto">
          <table class="w-full text-left text-sm text-gray-600">
            <thead class="bg-gray-100 text-gray-700 uppercase text-[11px]">
              <tr>
                <th class="p-2.5">Item</th>
                <th class="p-2.5">Category</th>
                <th class="p-2.5">Price</th>
                <th class="p-2.5 text-right">Actions</th>
              </tr>
            </thead>
            <tbody id="adminProductTable" class="divide-y divide-gray-200">
              <tr>
                <td colspan="4" class="text-center py-8 text-gray-400">Loading products...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

  </main>

  <!-- Edit Modal -->
  <div id="editModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50 p-4">
    <div class="bg-white rounded-lg max-w-lg w-full p-5 shadow-xl relative max-h-[90vh] overflow-y-auto">
      <button onclick="closeModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 text-lg">
        <i class="fa-solid fa-xmark"></i>
      </button>
      <h3 class="text-base font-bold text-gray-900 mb-4">Edit Product Details</h3>
      
      <form id="editForm" class="space-y-3">
        <input type="hidden" id="editId" />
        
        <div>
          <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Title *</label>
          <input type="text" id="editTitle" required class="w-full px-3 py-1.5 border rounded-md text-sm" />
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Price (TSh) *</label>
          <input type="number" id="editPrice" required min="0" class="w-full px-3 py-1.5 border rounded-md text-sm" />
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Category</label>
          <input type="text" id="editCategory" class="w-full px-3 py-1.5 border rounded-md text-sm" />
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Description</label>
          <textarea id="editDescription" rows="2" class="w-full px-3 py-1.5 border rounded-md text-sm"></textarea>
        </div>

        <!-- Edit Image URLs (1 to 7) -->
        <div class="border-t border-gray-200 pt-3 space-y-2">
          <label class="block text-xs font-semibold text-gray-700 uppercase">Product Image URLs (1 to 7)</label>

          <div>
            <label class="block text-[11px] text-gray-600 font-medium">1. Image URL (Primary) *</label>
            <input type="url" id="editImageUrl1" required class="w-full px-2.5 py-1 border rounded-md text-xs" oninput="updateEditPreviews()" />
          </div>

          <div>
            <label class="block text-[11px] text-gray-600 font-medium">2. Image URL 2</label>
            <input type="url" id="editImageUrl2" class="w-full px-2.5 py-1 border rounded-md text-xs" oninput="updateEditPreviews()" />
          </div>

          <div>
            <label class="block text-[11px] text-gray-600 font-medium">3. Image URL 3</label>
            <input type="url" id="editImageUrl3" class="w-full px-2.5 py-1 border rounded-md text-xs" oninput="updateEditPreviews()" />
          </div>

          <div>
            <label class="block text-[11px] text-gray-600 font-medium">4. Image URL 4</label>
            <input type="url" id="editImageUrl4" class="w-full px-2.5 py-1 border rounded-md text-xs" oninput="updateEditPreviews()" />
          </div>

          <div>
            <label class="block text-[11px] text-gray-600 font-medium">5. Image URL 5</label>
            <input type="url" id="editImageUrl5" class="w-full px-2.5 py-1 border rounded-md text-xs" oninput="updateEditPreviews()" />
          </div>

          <div>
            <label class="block text-[11px] text-gray-600 font-medium">6. Image URL 6</label>
            <input type="url" id="editImageUrl6" class="w-full px-2.5 py-1 border rounded-md text-xs" oninput="updateEditPreviews()" />
          </div>

          <div>
            <label class="block text-[11px] text-gray-600 font-medium">7. Image URL 7</label>
            <input type="url" id="editImageUrl7" class="w-full px-2.5 py-1 border rounded-md text-xs" oninput="updateEditPreviews()" />
          </div>

          <div class="pt-2">
            <span class="block text-[11px] font-semibold text-gray-600 mb-1">Previews:</span>
            <div id="editPreviewsContainer" class="flex gap-1.5 flex-wrap"></div>
          </div>
        </div>

        <div class="flex justify-end gap-2 pt-3 border-t">
          <button type="button" onclick="closeModal()" class="px-3 py-1.5 border rounded-md text-xs text-gray-600">Cancel</button>
          <button type="submit" id="editSubmitBtn" class="px-3 py-1.5 bg-[#4285F4] text-white rounded-md text-xs font-semibold hover:bg-blue-600">Save Changes</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCSX8vQVmSP1g-_WyyXy6Q3BLJBtxKgaao",
      authDomain: "m-center-tz.firebaseapp.com",
      projectId: "m-center-tz",
      storageBucket: "m-center-tz.firebasestorage.app",
      messagingSenderId: "240432444424",
      appId: "1:240432444424:web:1dbfe6519d8e2bc13f4dbd",
      measurementId: "G-S6QKP8JN1D"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const CLOUDINARY_URL = "https://api.cloudinary.com/v1_1/divvqc3b6/image/upload";
    const CLOUDINARY_PRESET = "test_chapel";

    let adminProductsList = [];

    db.collection('products')
      .orderBy('timestamp', 'desc')
      .onSnapshot((snapshot) => {
        adminProductsList = [];
        snapshot.forEach((doc) => adminProductsList.push({ id: doc.id, ...doc.data() }));
        renderAdminTable(adminProductsList);
      }, (error) => {
        console.error("Firestore snapshot error:", error);
      });

    function renderAdminTable(products) {
      const tbody = document.getElementById('adminProductTable');
      document.getElementById('adminProductCount').innerText = `${products.length} Items`;

      if (products.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" class="text-center py-6 text-gray-400">No products uploaded yet.</td></tr>`;
        return;
      }

      tbody.innerHTML = products.map((item) => {
        const primaryImage = (item.images && item.images.length > 0) ? item.images[0] : (item.imageUrl || '');
        const imageCount = item.images ? item.images.length : (item.imageUrl ? 1 : 0);

        return `
          <tr class="hover:bg-gray-50 border-b border-gray-100">
            <td class="p-2.5 flex items-center gap-2">
              <img src="${escapeHtml(primaryImage)}" class="w-8 h-8 object-cover rounded border" onerror="this.src='https://via.placeholder.com/40';" />
              <div>
                <p class="font-bold text-gray-900 line-clamp-1 text-xs">${escapeHtml(item.title)}</p>
                <span class="text-[10px] text-gray-400"><i class="fa-regular fa-image"></i> ${imageCount} photo(s)</span>
              </div>
            </td>
            <td class="p-2.5 text-[11px]"><span class="bg-gray-100 px-1.5 py-0.5 rounded">${escapeHtml(item.category || 'General')}</span></td>
            <td class="p-2.5 font-semibold text-gray-800 text-xs">TSh ${Number(item.price || 0).toLocaleString()}</td>
            <td class="p-2.5 text-right space-x-1">
              <button onclick="openEditModal('${item.id}')" class="text-blue-600 hover:text-blue-800 font-medium text-[11px] px-1.5 py-0.5 rounded border border-blue-200">
                Edit
              </button>
              <button onclick="deleteProduct('${item.id}')" class="text-red-600 hover:text-red-800 font-medium text-[11px] px-1.5 py-0.5 rounded border border-red-200">
                Delete
              </button>
            </td>
          </tr>
        `;
      }).join('');
    }

    async function uploadToCloudinary(file) {
      if (!file.type.startsWith('image/')) {
        throw new Error('Selected file is not an image.');
      }

      const formData = new FormData();
      formData.append('file', file);
      formData.append('upload_preset', CLOUDINARY_PRESET);

      const response = await fetch(CLOUDINARY_URL, { method: 'POST', body: formData });
      if (!response.ok) {
        const errData = await response.json().catch(() => ({}));
        throw new Error(errData.error?.message || 'Cloudinary upload failed');
      }
      const data = await response.json();
      return data.secure_url;
    }

    document.getElementById('productForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const btnText = document.getElementById('btnText');
      const submitBtn = document.getElementById('submitBtn');
      
      submitBtn.disabled = true;
      btnText.innerText = "Processing...";

      try {
        const title = document.getElementById('title').value.trim();
        const price = parseFloat(document.getElementById('price').value);
        const category = document.getElementById('category').value;
        const description = document.getElementById('description').value.trim();
        
        const fileInput = document.getElementById('fileInput');
        let imageUrls = [];

        // Check if local files were selected (up to 7)
        if (fileInput.files.length > 0) {
          if (fileInput.files.length > 7) {
            alert("You can select a maximum of 7 images from your computer.");
            submitBtn.disabled = false;
            btnText.innerText = "Save & Publish Product";
            return;
          }

          const filesArray = Array.from(fileInput.files);
          for (let i = 0; i < filesArray.length; i++) {
            btnText.innerText = `Uploading Image ${i + 1} of ${filesArray.length}...`;
            const uploadedUrl = await uploadToCloudinary(filesArray[i]);
            imageUrls.push(uploadedUrl);
          }
        }

        // Gather any manual Direct Image URLs (1 to 7)
        for (let i = 1; i <= 7; i++) {
          const val = document.getElementById(`imageUrl${i}`).value.trim();
          if (val && imageUrls.length < 7) {
            imageUrls.push(val);
          }
        }

        if (imageUrls.length === 0) {
          alert("Please select at least 1 local image file or enter an image URL.");
          submitBtn.disabled = false;
          btnText.innerText = "Save & Publish Product";
          return;
        }

        btnText.innerText = "Saving Product...";
        await db.collection('products').add({
          title,
          price,
          category,
          description,
          imageUrl: imageUrls[0], // Primary image for backwards compatibility
          images: imageUrls.slice(0, 7), // Array capped at 7 items
          timestamp: firebase.firestore.FieldValue.serverTimestamp()
        });

        document.getElementById('productForm').reset();
        alert("Product published successfully!");
      } catch (err) {
        console.error(err);
        alert("Error creating product: " + err.message);
      } finally {
        submitBtn.disabled = false;
        btnText.innerText = "Save & Publish Product";
      }
    });

    async function deleteProduct(id) {
      if (confirm("Are you sure you want to delete this product?")) {
        try {
          await db.collection('products').doc(id).delete();
        } catch (err) {
          alert("Failed to delete product: " + err.message);
        }
      }
    }

    function openEditModal(id) {
      const product = adminProductsList.find((p) => p.id === id);
      if (!product) return;

      document.getElementById('editId').value = product.id;
      document.getElementById('editTitle').value = product.title || '';
      document.getElementById('editPrice').value = product.price || 0;
      document.getElementById('editCategory').value = product.category || 'General';
      document.getElementById('editDescription').value = product.description || '';

      const imagesArray = product.images || (product.imageUrl ? [product.imageUrl] : []);

      for (let i = 1; i <= 7; i++) {
        document.getElementById(`editImageUrl${i}`).value = imagesArray[i - 1] || '';
      }

      updateEditPreviews();

      document.getElementById('editModal').classList.remove('hidden');
      document.getElementById('editModal').classList.add('flex');
    }

    function updateEditPreviews() {
      const container = document.getElementById('editPreviewsContainer');
      container.innerHTML = '';

      for (let i = 1; i <= 7; i++) {
        const url = document.getElementById(`editImageUrl${i}`).value.trim();
        if (url) {
          const img = document.createElement('img');
          img.src = url;
          img.className = 'w-10 h-10 object-cover rounded border';
          img.onerror = () => { img.src = 'https://via.placeholder.com/40?text=Error'; };
          container.appendChild(img);
        }
      }
    }

    function closeModal() {
      document.getElementById('editModal').classList.add('hidden');
      document.getElementById('editModal').classList.remove('flex');
    }

    document.getElementById('editForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('editId').value;
      const editSubmitBtn = document.getElementById('editSubmitBtn');

      editSubmitBtn.disabled = true;
      editSubmitBtn.innerText = "Saving...";

      let updatedImages = [];
      for (let i = 1; i <= 7; i++) {
        const val = document.getElementById(`editImageUrl${i}`).value.trim();
        if (val) updatedImages.push(val);
      }

      if (updatedImages.length === 0) {
        alert("Please provide at least 1 image URL.");
        editSubmitBtn.disabled = false;
        editSubmitBtn.innerText = "Save Changes";
        return;
      }

      try {
        await db.collection('products').doc(id).update({
          title: document.getElementById('editTitle').value.trim(),
          price: parseFloat(document.getElementById('editPrice').value),
          category: document.getElementById('editCategory').value.trim(),
          description: document.getElementById('editDescription').value.trim(),
          imageUrl: updatedImages[0],
          images: updatedImages
        });
        closeModal();
      } catch (err) {
        alert("Failed to update product: " + err.message);
      } finally {
        editSubmitBtn.disabled = false;
        editSubmitBtn.innerText = "Save Changes";
      }
    });

    function escapeHtml(str) {
      return (str || '').replace(/[&<>"']/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
    }
  </script>
</body>
</html>
