<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>M Mall | Online Shopping</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  
  <style>
    :root {
      --color-blue: #4285F4;
      --color-blue-hover: #1557b0;
      --color-yellow: #FBBC05;
      --color-green: #34A853;
      --color-black: #000000;
      --color-white: #ffffff;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>

  <!-- Firebase Compat SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-100 font-sans text-gray-800 antialiased min-h-screen flex flex-col pb-16 md:pb-0 select-none">

  <!-- Header -->
  <header class="bg-black text-white sticky top-0 z-50 shadow-md">
    <div class="max-w-7xl mx-auto px-3 py-2 flex items-center justify-between gap-2">
      <a href="index.html" class="flex items-center">
        <img src="images/logo.png" alt="M Mall" class="h-7 sm:h-9 object-contain" onerror="this.onerror=null; this.src='https://via.placeholder.com/100x30?text=M+Mall';" />
      </a>

      <div class="flex items-center gap-3">
        <a href="m_mall_admin.html" class="text-xs bg-gray-800 hover:bg-gray-700 text-yellow-400 px-2.5 py-1.5 rounded-full border border-gray-700 flex items-center gap-1 font-medium">
          <i class="fa-solid fa-user-gear"></i>
          <span class="hidden sm:inline">Admin Portal</span>
        </a>
      </div>
    </div>

    <!-- Search Bar -->
    <div class="max-w-7xl mx-auto px-3 pb-2.5">
      <div class="flex rounded-lg overflow-hidden bg-white text-gray-800 shadow-inner">
        <input type="text" id="searchInput" placeholder="Search M Mall products..." class="w-full px-3 py-2 text-sm focus:outline-none" />
        <button id="searchBtn" class="bg-[#FBBC05] px-4 py-2 text-black active:bg-yellow-500">
          <i class="fa-solid fa-magnifying-glass text-base"></i>
        </button>
      </div>
    </div>

    <!-- Category Filter Pills -->
    <div id="categoryContainer" class="flex items-center gap-2 px-3 py-2 overflow-x-auto no-scrollbar bg-gray-900 border-t border-gray-800 text-xs text-gray-300">
      <button onclick="selectCategory('All')" class="category-btn active bg-[#FBBC05] text-black font-semibold px-3 py-1 rounded-full whitespace-nowrap">All</button>
      <button onclick="selectCategory('Electronics')" class="category-btn bg-gray-800 hover:bg-gray-700 px-3 py-1 rounded-full whitespace-nowrap">Electronics</button>
      <button onclick="selectCategory('Fashion')" class="category-btn bg-gray-800 hover:bg-gray-700 px-3 py-1 rounded-full whitespace-nowrap">Fashion</button>
      <button onclick="selectCategory('Home & Kitchen')" class="category-btn bg-gray-800 hover:bg-gray-700 px-3 py-1 rounded-full whitespace-nowrap">Home & Kitchen</button>
      <button onclick="selectCategory('Beauty')" class="category-btn bg-gray-800 hover:bg-gray-700 px-3 py-1 rounded-full whitespace-nowrap">Beauty</button>
    </div>
  </header>

  <!-- Banner -->
  <section class="bg-gradient-to-r from-gray-900 via-gray-800 to-black text-white py-3 px-3">
    <div class="max-w-7xl mx-auto flex items-center justify-between text-xs sm:text-sm">
      <div class="flex items-center gap-2">
        <i class="fa-solid fa-truck-fast text-[#FBBC05] text-base"></i>
        <span>Fast Delivery & Instant WhatsApp Ordering</span>
      </div>
      <span id="productCount" class="font-bold text-[#FBBC05] text-xs">...</span>
    </div>
  </section>

  <!-- Product Grid -->
  <main class="max-w-7xl mx-auto px-2 sm:px-4 py-3 flex-1 w-full">
    <div id="productGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-2 sm:gap-4">
      <div class="col-span-full text-center py-12">
        <i class="fa-solid fa-circle-notch fa-spin text-3xl text-[#4285F4] mb-2"></i>
        <p class="text-xs text-gray-500">Loading live products...</p>
      </div>
    </div>
  </main>

  <!-- Bottom Navigation (Mobile Only) -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 flex justify-around py-1.5 z-50 md:hidden shadow-lg text-gray-600">
    <a href="index.html" class="flex flex-col items-center text-[#4285F4]">
      <i class="fa-solid fa-house text-lg"></i>
      <span class="text-[10px] font-medium mt-0.5">Home</span>
    </a>
    <button onclick="focusSearch()" class="flex flex-col items-center">
      <i class="fa-solid fa-magnifying-glass text-lg"></i>
      <span class="text-[10px] font-medium mt-0.5">Search</span>
    </button>
    <a href="m_mall_admin.html" class="flex flex-col items-center">
      <i class="fa-solid fa-user-gear text-lg"></i>
      <span class="text-[10px] font-medium mt-0.5">Admin</span>
    </a>
  </nav>

  <footer class="bg-black text-gray-400 py-4 border-t border-gray-800 text-center text-xs mb-12 md:mb-0">
    <p>&copy; 2026 M Mall. All Rights Reserved.</p>
  </footer>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCSX8vQVmSP1g-_WyyXy6Q3BLJBtxKgaao",
      authDomain: "m-center-tz.firebaseapp.com",
      projectId: "m-center-tz",
      storageBucket: "m-center-tz.firebasestorage.app",
      messagingSenderId: "240432444424",
      appId: "1:240432444424:web:1dbfe6519d8e2bc13f4dbd",
      measurementId: "G-S6QKP8JN1D"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const WHATSAPP_PHONE = "255778743765";

    let allProducts = [];
    let activeCategory = 'All';

    db.collection('products')
      .orderBy('timestamp', 'desc')
      .onSnapshot((snapshot) => {
        allProducts = [];
        snapshot.forEach((doc) => allProducts.push({ id: doc.id, ...doc.data() }));
        filterAndRender();
      }, (error) => {
        console.error(error);
        document.getElementById('productGrid').innerHTML = `
          <div class="col-span-full text-center py-8 text-red-500 text-xs">
            Failed to load products.
          </div>`;
      });

    function renderProducts(products) {
      const grid = document.getElementById('productGrid');
      const countEl = document.getElementById('productCount');
      
      countEl.innerText = `${products.length} Items`;

      if (products.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full text-center py-12 bg-white rounded-lg shadow-sm border border-gray-200">
            <i class="fa-solid fa-box-open text-3xl text-gray-300 mb-2"></i>
            <p class="text-gray-500 text-xs">No products found.</p>
          </div>`;
        return;
      }

      grid.innerHTML = products.map((product) => {
        const imageUrl = product.imageUrl || 'https://via.placeholder.com/200x200?text=No+Image';
        const formattedPrice = Number(product.price).toLocaleString();
        
        return `
          <div class="bg-white rounded-lg shadow-sm border border-gray-200 flex flex-col overflow-hidden active:scale-[0.98] transition-transform duration-100">
            <div class="relative pt-[90%] bg-gray-50 overflow-hidden">
              <img src="${imageUrl}" alt="${escapeHtml(product.title)}" class="absolute inset-0 w-full h-full object-contain p-2" onerror="this.src='https://via.placeholder.com/200x200?text=Error';" />
              ${product.category ? `<span class="absolute top-1 left-1 bg-black text-white text-[9px] font-bold px-1.5 py-0.5 rounded opacity-80">${escapeHtml(product.category)}</span>` : ''}
            </div>
            
            <div class="p-2 flex flex-col flex-grow justify-between">
              <div>
                <h3 class="font-semibold text-gray-900 text-xs sm:text-sm line-clamp-2 leading-tight mb-1">${escapeHtml(product.title)}</h3>
                <p class="text-[11px] text-gray-400 line-clamp-1 mb-2">${escapeHtml(product.description || '')}</p>
              </div>
              
              <div>
                <div class="text-sm sm:text-base font-extrabold text-gray-900 mb-2">
                  <span class="text-[10px] text-gray-500 font-normal">TSh</span> ${formattedPrice}
                </div>
                
                <button id="btn-${product.id}" onclick="orderViaWhatsApp('${product.id}', '${escapeJs(product.title)}', '${formattedPrice}', '${escapeJs(imageUrl)}')" 
                  class="w-full bg-[#34A853] active:bg-green-700 text-white font-bold py-1.5 rounded text-xs flex items-center justify-center gap-1 shadow-sm transition-all duration-150">
                  <i class="fa-brands fa-whatsapp text-sm"></i>
                  <span>Order Now</span>
                </button>
              </div>
            </div>
          </div>`;
      }).join('');
    }

    function selectCategory(cat) {
      activeCategory = cat;
      document.querySelectorAll('.category-btn').forEach(btn => {
        if(btn.innerText === cat) {
          btn.className = "category-btn active bg-[#FBBC05] text-black font-semibold px-3 py-1 rounded-full whitespace-nowrap";
        } else {
          btn.className = "category-btn bg-gray-800 hover:bg-gray-700 px-3 py-1 rounded-full whitespace-nowrap";
        }
      });
      filterAndRender();
    }

    function filterAndRender() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      const filtered = allProducts.filter((p) => {
        const matchesCat = activeCategory === 'All' || (p.category && p.category === activeCategory);
        const matchesQuery = p.title.toLowerCase().includes(query) || (p.description && p.description.toLowerCase().includes(query));
        return matchesCat && matchesQuery;
      });
      renderProducts(filtered);
    }

    document.getElementById('searchInput').addEventListener('input', filterAndRender);
    document.getElementById('searchBtn').addEventListener('click', filterAndRender);

    function focusSearch() {
      const input = document.getElementById('searchInput');
      input.focus();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Direct Link Order Handler with Visual Loading State
    function orderViaWhatsApp(productId, title, price, imageUrl) {
      const btn = document.getElementById(`btn-${productId}`);
      
      if (btn) {
        btn.disabled = true;
        btn.className = "w-full bg-yellow-500 text-black font-bold py-1.5 rounded text-xs flex items-center justify-center gap-1.5 shadow-sm opacity-90 cursor-wait";
        btn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin text-sm"></i><span>Opening WhatsApp...</span>`;
      }

      setTimeout(() => {
        const formattedMessage = `Hello M Mall! 👋\n\nI want to order:\n*Product:* ${title}\n*Price:* TSh ${price}\n\n*Product Image Link:*\n${imageUrl}`;
        const whatsappUrl = `https://wa.me/${WHATSAPP_PHONE}?text=${encodeURIComponent(formattedMessage)}`;
        
        window.open(whatsappUrl, '_blank');

        if (btn) {
          btn.disabled = false;
          btn.className = "w-full bg-[#34A853] active:bg-green-700 text-white font-bold py-1.5 rounded text-xs flex items-center justify-center gap-1 shadow-sm transition-all duration-150";
          btn.innerHTML = `<i class="fa-brands fa-whatsapp text-sm"></i><span>Order Now</span>`;
        }
      }, 700);
    }

    function escapeHtml(str) {
      return (str || '').replace(/[&<>"']/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
    }
    function escapeJs(str) {
      return (str || '').replace(/'/g, "\\'").replace(/"/g, '\\"');
    }
  </script>
</body>
</html>
